[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-consensus"
version = "0.1.0"
description = "Multi-agent voting and consensus engine implementing weighted majority, ranked-choice, and BFT voting"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
swarm-consensus = "swarm_consensus.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm_consensus*"]
